name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install dvc[gdrive]         # ✅ OR change to just `dvc` if you're not using Google Drive
        pip install pytest

    - name: 📁 Restore DVC data
      run: |
        dvc pull || echo "⚠️ DVC pull failed or no remote configured"

    - name: 🔁 Reproduce DVC pipeline
      run: |
        dvc repro

    - name: 🧪 Run tests
      env:
        PYTHONPATH: ./src   # ✅ Required to fix ModuleNotFoundError for `from src...`
      run: |
        pytest

    - name: 🐳 Build Docker image
      run: |
        docker build -t house-price-api .

