stages:
  preprocess:
    cmd: python src/data_preprocessing.py
    deps:
      - data/raw/train.csv
      - src/data_preprocessing.py
    outs:
      - data/processed/train_processed.csv

  train:
    cmd: python src/training.py
    deps:
      - data/processed/train_processed.csv
      - src/training.py
    outs:
      - model.joblib

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - data/processed/train_processed.csv
      - model.joblib
      - src/evaluate.py
    outs:
      - evaluation_metrics.txt

  drift:
    cmd: python monitor_drift.py
    deps:
      - data/reference.csv
      - data/current.csv
      - monitor_drift.py
    outs:
      - reports/drift_report.html
