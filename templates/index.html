<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏡 House Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 420px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #555;
        }
        input {
            padding: 0.6rem;
            margin-bottom: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 1.1rem;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏡 Predict House Price</h2>
        <form method="post" action="/predict">
            <label for="first_flr">1st Floor Area (in sq ft)</label>
            <input type="number" name="first_flr" min="0" step="1" placeholder="e.g., 856" required />

            <label for="second_flr">2nd Floor Area (in sq ft)</label>
            <input type="number" name="second_flr" min="0" step="1" placeholder="e.g., 450" required />

            <label for="bedrooms">Bedrooms Above Ground</label>
            <input type="number" name="bedrooms" min="1" max="10" placeholder="e.g., 3" required />

            <label for="total_rooms">Total Rooms Above Ground</label>
            <input type="number" name="total_rooms" min="1" max="15" placeholder="e.g., 6" required />

            <label for="garage">Garage Area (in sq ft)</label>
            <input type="number" name="garage" min="0" step="1" placeholder="e.g., 480" required />

            <label for="living_area">Living Area (in sq ft)</label>
            <input type="number" name="living_area" min="100" step="1" placeholder="e.g., 1500" required />

            <label for="lot_area">Lot Area (in sq ft)</label>
            <input type="number" name="lot_area" min="1000" step="1" placeholder="e.g., 7500" required />

            <label for="quality">Overall Quality (1 = Poor, 10 = Excellent)</label>
            <input type="number" name="quality" min="1" max="10" placeholder="e.g., 7" required />

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result">
            <strong>Predicted Price:</strong> {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
