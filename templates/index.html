<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏡 House Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(120deg, #d4fc79, #96e6a1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 420px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #555;
        }
        input {
            padding: 0.6rem;
            margin-bottom: 1.1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 1.2rem;
            color: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏡 Predict House Price</h2>
        <form method="post" action="/predict_form">
            <label>1st Floor Area (sq ft)</label>
            <input type="number" name="first_flr" min="0" step="1" required placeholder="e.g., 856">

            <label>2nd Floor Area (sq ft)</label>
            <input type="number" name="second_flr" min="0" step="1" required placeholder="e.g., 450">

            <label>Bedrooms Above Ground</label>
            <input type="number" name="bedrooms" min="1" max="10" required placeholder="e.g., 3">

            <label>Total Rooms Above Ground</label>
            <input type="number" name="total_rooms" min="1" max="15" required placeholder="e.g., 6">

            <label>Garage Area (sq ft)</label>
            <input type="number" name="garage" min="0" step="1" required placeholder="e.g., 480">

            <label>Living Area (sq ft)</label>
            <input type="number" name="living_area" min="100" step="1" required placeholder="e.g., 1500">

            <label>Lot Area (sq ft)</label>
            <input type="number" name="lot_area" min="1000" step="1" required placeholder="e.g., 7500">

            <label>Overall Quality (1 = Poor, 10 = Excellent)</label>
            <input type="number" name="quality" min="1" max="10" required placeholder="e.g., 7">

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result">
            Predicted Price: {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
