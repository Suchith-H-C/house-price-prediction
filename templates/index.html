<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏠 House Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 1rem;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            padding: 0.6rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 0.7rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            text-align: center;
            margin-top: 1rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏡 Predict House Price</h2>
        <form method="post" action="/predict">
            <input type="number" name="first_flr" placeholder="1st Floor SF" required />
            <input type="number" name="second_flr" placeholder="2nd Floor SF" required />
            <input type="number" name="bedrooms" placeholder="Bedrooms Above Ground" required />
            <input type="number" name="total_rooms" placeholder="Total Rooms Above Ground" required />
            <input type="number" name="garage" placeholder="Garage Area" required />
            <input type="number" name="living_area" placeholder="Ground Living Area" required />
            <input type="number" name="lot_area" placeholder="Lot Area" required />
            <input type="number" name="quality" placeholder="Overall Quality" required />
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result">
            <strong>Predicted Price:</strong> {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
