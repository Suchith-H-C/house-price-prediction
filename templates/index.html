<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏠 House Price Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 1rem;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 1rem;
            text-align: center;
            font-size: 1.2rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏡 Predict House Price</h2>
        <form method="post" action="/predict">
            <input type="number" name="OverallQual" placeholder="Overall Quality (e.g. 7)" required />
            <input type="number" step="0.01" name="GrLivArea" placeholder="Living Area (sq ft)" required />
            <input type="number" name="GarageCars" placeholder="Garage Cars" required />
            <input type="number" step="0.01" name="TotalBsmtSF" placeholder="Total Basement Area" required />
            <input type="number" name="FullBath" placeholder="Number of Bathrooms" required />
            <input type="number" name="YearBuilt" placeholder="Year Built (e.g. 2005)" required />
            <button type="submit">Predict Price</button>
        </form>
        {% if result %}
        <div class="result">
            <strong>Predicted Price:</strong> {{ result }}
        </div>
        {% endif %}
    </div>
</body>
</html>
